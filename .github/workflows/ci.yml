name: Scientific checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Task 3 kinetic and residence-time self-checks
        run: python projects/task03_covalent_kinetics/run_task3_covalent_kinetics_residence_time.py --self-test-only
      - name: Project layout, links and scientific artifact preservation
        run: python tools/validate_repository_layout.py --out work/layout_validation.json
